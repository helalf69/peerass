<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer assessment</title>
    <link rel="icon" href="/include/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <img
      class="logo-backdrop"
      src="/include/logo.png"
      alt=""
      aria-hidden="true"
    />

    <nav class="top-actions" aria-label="Quick actions">
      <span class="whoami hidden" id="whoami" aria-live="polite"></span>

      <a class="button button-sm hidden" id="admin-link" href="/admin.html" title="Admin">🅰️</a>

      <button
        type="button"
        class="button button-sm"
        id="auth-button"
        aria-controls="login-overlay"
        title="Login / Logout"
      >
        🔓
      </button>

      <a class="button button-sm" href="/" title="Home">🏠</a>
    </nav>

    <main class="page">
      <section class="content">
        <h1 class="title">Peer assessment</h1>
<!--        
        <p class="subtitle">
          A clean, peach-themed landing page with a contrasting
          <span class="accent">accent</span> palette.
        </p>
-->
        <section class="assessments-section" aria-labelledby="assessments-heading">
          <h2 id="assessments-heading" class="assessments-heading">Assessments</h2>
          <p id="assessments-hint" class="assessments-hint muted">
            Log in to see assessments for your subjects.
          </p>
          <ul id="assessments-list" class="assessments-list"></ul>
          <a
            class="button button-with-favicon hidden assessments-add"
            id="add-assessment-link"
            href="/assessment-new.html"
            title="Add assessment"
          >
            <img class="button-favicon" src="/include/favicon.png" alt="" width="18" height="18" />
            <span>Add assessment</span>
          </a>
        </section>
      </section>
    </main>

    <div class="overlay hidden" id="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="overlay-card">
        <h2 id="login-title">Login</h2>
        <form id="login-form" class="login-form">
          <label>
            Name
            <input type="text" name="name" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-message" class="login-message" aria-live="polite"></p>
          <div class="overlay-actions">
            <button type="submit" class="button button-sm primary">Sign in</button>
            <button type="button" class="button button-sm" id="close-login">Close</button>
          </div>
        </form>
      </div>
    </div>

    <div
      class="overlay hidden"
      id="pw-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pw-title"
    >
      <div class="overlay-card">
        <h2 id="pw-title">Change password</h2>
        <form id="pw-form" class="login-form">
          <label>
            Old password
            <input type="password" name="oldPassword" autocomplete="current-password" required />
          </label>
          <label>
            New password
            <input type="password" name="newPassword" autocomplete="new-password" required />
          </label>
          <label>
            Confirm password
            <input type="password" name="confirmPassword" autocomplete="new-password" required />
          </label>
          <p id="pw-message" class="login-message" aria-live="polite"></p>
          <div class="overlay-actions">
            <button type="submit" class="button button-sm primary">Update</button>
            <button type="button" class="button button-sm" id="pw-ignore">Ignore</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const overlay = document.getElementById("login-overlay");
      const closeBtn = document.getElementById("close-login");
      const form = document.getElementById("login-form");
      const msg = document.getElementById("login-message");
      const authBtn = document.getElementById("auth-button");
      const whoami = document.getElementById("whoami");
      const adminLink = document.getElementById("admin-link");
      const addAssessmentLink = document.getElementById("add-assessment-link");
      const assessmentsList = document.getElementById("assessments-list");
      const assessmentsHint = document.getElementById("assessments-hint");

      const pwOverlay = document.getElementById("pw-overlay");
      const pwForm = document.getElementById("pw-form");
      const pwMsg = document.getElementById("pw-message");
      const pwIgnore = document.getElementById("pw-ignore");
      let currentUser = null;

      function toggleOverlay(show) {
        overlay.classList.toggle("hidden", !show);
      }

      function togglePwOverlay(show) {
        pwOverlay.classList.toggle("hidden", !show);
      }

      function setAuthedUI(user) {
        currentUser = user || null;

        const authed = Boolean(currentUser);
        whoami.classList.toggle("hidden", !authed);
        adminLink.classList.toggle("hidden", !(authed && currentUser.isAdmin));
        addAssessmentLink.classList.toggle("hidden", !(authed && currentUser.isAdmin));
        addAssessmentLink.setAttribute("href", "/assessment-new.html");

        if (authed) {
          whoami.textContent = currentUser.name;
          authBtn.textContent = "🔒";
          authBtn.setAttribute("aria-controls", "");
        } else {
          whoami.textContent = "";
          authBtn.textContent = "🔓";
          authBtn.setAttribute("aria-controls", "login-overlay");
        }
        void loadAssessmentsList();
      }

      function esc(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatTs(sec) {
        if (sec == null) return "—";
        const d = new Date(Number(sec) * 1000);
        return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
      }

      function assessmentStatusLabel(a) {
        const now = Math.floor(Date.now() / 1000);
        if (a.isPlanned && !a.isOpen) return "Planned";
        if (a.isOpen) {
          if (a.startsAt != null && now < a.startsAt) return "Scheduled";
          if (a.endsAt != null && now > a.endsAt) return "Ended";
          return "Open";
        }
        if (a.endsAt != null && now > a.endsAt) return "Ended";
        return "Closed";
      }

      async function loadAssessmentsList() {
        assessmentsList.innerHTML = "";
        if (!currentUser) {
          assessmentsHint.textContent = "Log in to see assessments for your subjects.";
          assessmentsHint.classList.remove("hidden");
          return;
        }
        assessmentsHint.textContent = "Loading…";
        try {
          const response = await fetch(
            "/api/assessments"
          );
          const data = await response.json();
          if (!response.ok || !data.ok) {
            assessmentsHint.textContent = "No available assessments.";
            assessmentsHint.classList.remove("hidden");
            return;
          }
          const items = data.assessments || [];
          if (items.length === 0) {
            assessmentsHint.textContent = "No available assessments.";
            assessmentsHint.classList.remove("hidden");
            assessmentsList.innerHTML = "";
            return;
          }
          assessmentsHint.classList.add("hidden");
          assessmentsHint.textContent = "";
          assessmentsList.innerHTML = items
            .map((a) => {
              const status = esc(assessmentStatusLabel(a));
              const editLink =
                currentUser && currentUser.isAdmin
                  ? `<a class="button button-sm" href="/assessment-edit.html?idAssessment=${encodeURIComponent(a.idAssessment)}">Edit</a>`
                  : "";
              const studentLink =
                currentUser && !currentUser.isAdmin
                  ? a.attendanceStatus === "absent"
                    ? `<span class="assessment-meta absent-label">Marked absent</span>`
                    : a.hasSubmission
                    ? `<a class="button button-sm" href="/assessment-view.html?idAssessment=${encodeURIComponent(a.idAssessment)}">View assessment</a>`
                    : `<a class="button button-sm primary" href="/assessment-start.html?idAssessment=${encodeURIComponent(a.idAssessment)}">Start assessment</a>`
                  : "";
              const nowSec = Math.floor(Date.now() / 1000);
              const withinWindow =
                a.startsAt != null &&
                a.endsAt != null &&
                nowSec >= Number(a.startsAt) &&
                nowSec <= Number(a.endsAt);
              const rollcallLink =
                currentUser && currentUser.isAdmin && withinWindow
                  ? `<a class="button button-sm" href="/assessment-view.html?idAssessment=${encodeURIComponent(a.idAssessment)}">Rollcall</a>`
                  : "";
              return `<li class="assessment-item">
                <span class="assessment-title">${esc(a.title)}</span>
                <span class="assessment-meta">${esc(a.subName)} · ${status}</span>
                <span class="assessment-dates">Start: ${esc(formatTs(a.startsAt))} · End: ${esc(formatTs(a.endsAt))}</span>
                ${editLink}
                ${rollcallLink}
                ${studentLink}
              </li>`;
            })
            .join("");
        } catch (_err) {
          assessmentsHint.textContent = "No available assessments.";
          assessmentsHint.classList.remove("hidden");
        }
      }

      async function logout() {
        try {
          await fetch("/api/logout", { method: "POST" });
        } catch (_err) {
          // ignore network errors on logout, clear UI anyway
        }
        setAuthedUI(null);
        togglePwOverlay(false);
      }

      authBtn.addEventListener("click", () => {
        if (currentUser) {
          void logout();
          return;
        }
        toggleOverlay(true);
      });

      closeBtn.addEventListener("click", () => toggleOverlay(false));
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) toggleOverlay(false);
      });
      pwOverlay.addEventListener("click", (e) => {
        if (e.target === pwOverlay) togglePwOverlay(false);
      });
      pwIgnore.addEventListener("click", () => togglePwOverlay(false));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "Signing in...";
        msg.classList.remove("error");

        const formData = new FormData(form);
        const payload = {
          name: formData.get("name"),
          password: formData.get("password"),
        };

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok || !data.ok) {
            msg.textContent = data.message || "Login failed.";
            msg.classList.add("error");
            return;
          }

          // Optimistically set UI, then immediately confirm session state with /api/me.
          // This avoids a "looks logged in" UI if the session cookie didn't persist.
          setAuthedUI(data.user);
          const confirmed = await bootstrapSession();
          if (!confirmed) {
            msg.textContent = "Login did not persist (session cookie missing). Refresh and try again.";
            msg.classList.add("error");
            toggleOverlay(true);
            return;
          }

          toggleOverlay(false);
          msg.textContent = "";
          form.reset();

          if (currentUser && currentUser.mustChangePassword) {
            pwForm.reset();
            pwMsg.textContent = "You are using the default password. Please change it.";
            pwMsg.classList.remove("error");
            togglePwOverlay(true);
          }
        } catch (_err) {
          msg.textContent = "Network error. Try again.";
          msg.classList.add("error");
        }
      });

      pwForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        pwMsg.textContent = "Updating...";
        pwMsg.classList.remove("error");

        if (!currentUser) {
          pwMsg.textContent = "You must be logged in.";
          pwMsg.classList.add("error");
          return;
        }

        const fd = new FormData(pwForm);
        const oldPassword = String(fd.get("oldPassword") || "");
        const newPassword = String(fd.get("newPassword") || "");
        const confirmPassword = String(fd.get("confirmPassword") || "");

        if (newPassword !== confirmPassword) {
          pwMsg.textContent = "New password and confirm password do not match.";
          pwMsg.classList.add("error");
          return;
        }

        try {
          const response = await fetch("/api/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              oldPassword,
              newPassword,
            }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            pwMsg.textContent = data.message || "Password change failed.";
            pwMsg.classList.add("error");
            return;
          }

          pwMsg.textContent = "Password updated.";
          togglePwOverlay(false);
          // Don’t keep implying password is default after a successful change.
          setAuthedUI({ ...currentUser, mustChangePassword: false });
          void loadAssessmentsList();
        } catch (_err) {
          pwMsg.textContent = "Network error. Try again.";
          pwMsg.classList.add("error");
        }
      });

      // Initial UI
      async function bootstrapSession() {
        try {
          const response = await fetch("/api/me");
          if (!response.ok) throw new Error("Not logged in");
          const data = await response.json();
          if (!data.ok || !data.user) throw new Error("Not logged in");
          setAuthedUI(data.user);
          return true;
        } catch (_err) {
          setAuthedUI(null);
          return false;
        }
      }
      void bootstrapSession();
      if (!currentUser) {
        setAuthedUI(null);
      }
      void loadAssessmentsList();
    </script>
  </body>
</html>
