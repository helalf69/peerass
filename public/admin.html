<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer assessment — Admin</title>
    <link rel="icon" href="/include/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <img class="logo-backdrop" src="/include/logo.png" alt="" aria-hidden="true" />

    <nav class="top-actions" aria-label="Quick actions">
      <a class="button button-sm" href="/" title="Home">🏠</a>
    </nav>

    <main class="page">
      <section class="content">
        <h1 class="title">Admin</h1>
        <p class="subtitle">Manage your subjects and register users into your own subjects.</p>

        <form id="add-subject-form" class="login-form admin-form">
          <label for="new-subject-name">Add subject</label>
          <div class="admin-inline">
            <input
              id="new-subject-name"
              name="subName"
              type="text"
              placeholder="Subject name"
              autocomplete="off"
              required
            />
            <button type="submit" class="button button-sm primary">Add subject</button>
          </div>
          <p id="subject-message" class="login-message" aria-live="polite"></p>
        </form>

        <form id="delete-subject-form" class="login-form admin-form">
          <label for="delete-subject-select">Delete subject</label>
          <div class="admin-inline">
            <select id="delete-subject-select" name="idSub" required></select>
            <button type="submit" class="button button-sm danger">Delete</button>
          </div>
          <p id="delete-subject-message" class="login-message" aria-live="polite"></p>
        </form>

        <form id="add-user-form" class="login-form admin-form">
          <label for="new-user-name">Add user</label>
          <div class="admin-inline">
            <input
              id="new-user-name"
              name="name"
              type="text"
              placeholder="User name"
              autocomplete="off"
              required
            />
            <select id="subject-select" name="idSub" required></select>
            <button type="submit" class="button button-sm primary">Register</button>
          </div>
          <p id="admin-message" class="login-message" aria-live="polite"></p>
        </form>

        <form id="copy-form" class="login-form admin-form">
          <label for="copy-source-subject">Copy names to a new subject</label>
          <div class="admin-inline">
            <select id="copy-source-subject" name="sourceIdSub" required></select>
            <input
              id="copy-new-subject-name"
              name="newSubName"
              type="text"
              placeholder="New subject name"
              autocomplete="off"
              required
            />
            <button type="submit" class="button button-sm primary">Copy names</button>
          </div>
          <p id="copy-message" class="login-message" aria-live="polite"></p>
        </form>

        <section class="admin-form">
          <h2 class="admin-h2">Users</h2>
          <div class="table-wrap">
            <table class="admin-table" aria-label="Users list">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Password changed</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          <p id="users-message" class="login-message" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <div
      class="overlay hidden"
      id="orphan-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="orphan-title"
    >
      <div class="overlay-card">
        <h2 id="orphan-title">Delete subject</h2>
        <p id="orphan-body" class="subtitle" style="margin-top: 8px"></p>
        <ul id="orphan-list" class="orphan-list"></ul>
        <div class="overlay-actions">
          <button type="button" class="button button-sm danger" id="orphan-delete-users">
            Yes, delete these users
          </button>
          <button type="button" class="button button-sm primary" id="orphan-keep-users">
            No, keep users (subject only)
          </button>
          <button type="button" class="button button-sm" id="orphan-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      const USER_STORE_KEY = "peerassUser";
      let currentUser = null;
      try {
        currentUser = JSON.parse(localStorage.getItem(USER_STORE_KEY) || "null");
      } catch (_err) {
        currentUser = null;
      }
      if (!currentUser || !currentUser.isAdmin) {
        window.location.href = "/";
      }

      const userForm = document.getElementById("add-user-form");
      const subjectForm = document.getElementById("add-subject-form");
      const deleteSubjectForm = document.getElementById("delete-subject-form");
      const copyForm = document.getElementById("copy-form");
      const message = document.getElementById("admin-message");
      const subjectMessage = document.getElementById("subject-message");
      const deleteSubjectMessage = document.getElementById("delete-subject-message");
      const copyMessage = document.getElementById("copy-message");
      const nameInput = document.getElementById("new-user-name");
      const subjectSelect = document.getElementById("subject-select");
      const copySourceSelect = document.getElementById("copy-source-subject");
      const deleteSubjectSelect = document.getElementById("delete-subject-select");
      const newSubjectInput = document.getElementById("new-subject-name");
      const copyNewSubjectInput = document.getElementById("copy-new-subject-name");
      const usersTbody = document.getElementById("users-tbody");
      const usersMessage = document.getElementById("users-message");
      const orphanOverlay = document.getElementById("orphan-overlay");
      const orphanBody = document.getElementById("orphan-body");
      const orphanList = document.getElementById("orphan-list");
      const orphanDeleteUsersBtn = document.getElementById("orphan-delete-users");
      const orphanKeepUsersBtn = document.getElementById("orphan-keep-users");
      const orphanCancelBtn = document.getElementById("orphan-cancel");

      let pendingDeleteIdSub = null;

      function setMsg(el, text, isError = false) {
        el.textContent = text;
        el.classList.toggle("error", isError);
      }

      function toggleOrphanOverlay(show) {
        orphanOverlay.classList.toggle("hidden", !show);
        if (!show) pendingDeleteIdSub = null;
      }

      async function deleteSubjectRequest(idSub, deleteOrphans) {
        return fetch("/api/admin/delete-subject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            actorId: currentUser.idUser,
            idSub,
            deleteOrphans,
          }),
        });
      }

      async function loadSubjects() {
        const response = await fetch(`/api/admin/subjects?actorId=${encodeURIComponent(currentUser.idUser)}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not load subjects.");

        const subjects = data.subjects || [];
        const options = subjects.map(
          (s) => `<option value="${s.idSub}">${s.subName}</option>`
        );
        subjectSelect.innerHTML = options.length
          ? options.join("")
          : `<option value="">No subject yet</option>`;
        copySourceSelect.innerHTML = options.length
          ? options.join("")
          : `<option value="">No subject yet</option>`;
        deleteSubjectSelect.innerHTML = options.length
          ? options.join("")
          : `<option value="">No subject yet</option>`;
      }

      function esc(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function loadUsers() {
        setMsg(usersMessage, "Loading users...");
        const response = await fetch(`/api/admin/users?actorId=${encodeURIComponent(currentUser.idUser)}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not load users.");

        const users = data.users || [];
        usersTbody.innerHTML = users.length
          ? users
              .map((u) => {
                const mark = u.passwordChanged ? "✓" : "✗";
                const cls = u.passwordChanged ? "ok" : "bad";
                return `<tr>
                  <td>${esc(u.name)}</td>
                  <td class="${cls}" aria-label="${u.passwordChanged ? "changed" : "default"}">${mark}</td>
                </tr>`;
              })
              .join("")
          : `<tr><td colspan="2">No users yet.</td></tr>`;

        setMsg(usersMessage, `${users.length} user(s).`);
      }

      subjectForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(subjectMessage, "Adding subject...");

        const subName = newSubjectInput.value.trim();
        try {
          const response = await fetch("/api/admin/add-subject", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ actorId: currentUser.idUser, subName }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(subjectMessage, data.message || "Could not add subject.", true);
            return;
          }
          setMsg(subjectMessage, data.message || "Subject added.");
          subjectForm.reset();
          await loadSubjects();
          await loadUsers();
          newSubjectInput.focus();
        } catch (_err) {
          setMsg(subjectMessage, "Network error. Try again.", true);
        }
      });

      deleteSubjectForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const idSub = Number(deleteSubjectSelect.value);
        if (!Number.isFinite(idSub) || idSub <= 0) {
          setMsg(deleteSubjectMessage, "Select a subject.", true);
          return;
        }
        setMsg(deleteSubjectMessage, "Checking...");
        try {
          const response = await deleteSubjectRequest(idSub, undefined);
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(deleteSubjectMessage, data.message || "Could not delete subject.", true);
            return;
          }
          if (data.needsOrphanDecision) {
            pendingDeleteIdSub = idSub;
            orphanBody.textContent = `Deleting "${data.subName}" would leave these users with no subject links. Delete these users too?`;
            orphanList.innerHTML = (data.orphanUsers || [])
              .map((u) => `<li>${esc(u.name)}</li>`)
              .join("");
            toggleOrphanOverlay(true);
            setMsg(deleteSubjectMessage, "");
            return;
          }
          setMsg(deleteSubjectMessage, data.message || "Subject deleted.");
          deleteSubjectForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(deleteSubjectMessage, "Network error. Try again.", true);
        }
      });

      orphanCancelBtn.addEventListener("click", () => toggleOrphanOverlay(false));
      orphanOverlay.addEventListener("click", (e) => {
        if (e.target === orphanOverlay) toggleOrphanOverlay(false);
      });

      async function finishDelete(deleteOrphans) {
        if (!pendingDeleteIdSub) return;
        setMsg(deleteSubjectMessage, "Deleting...");
        try {
          const response = await deleteSubjectRequest(pendingDeleteIdSub, deleteOrphans);
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(deleteSubjectMessage, data.message || "Could not delete subject.", true);
            return;
          }
          toggleOrphanOverlay(false);
          setMsg(deleteSubjectMessage, data.message || "Subject deleted.");
          deleteSubjectForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(deleteSubjectMessage, "Network error. Try again.", true);
        }
      }

      orphanDeleteUsersBtn.addEventListener("click", () => finishDelete(true));
      orphanKeepUsersBtn.addEventListener("click", () => finishDelete(false));

      userForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(message, "Registering...");
        const name = nameInput.value.trim();
        const idSub = Number(subjectSelect.value);
        try {
          const response = await fetch("/api/admin/add-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ actorId: currentUser.idUser, name, idSub }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(message, data.message || "Could not register user.", true);
            return;
          }
          setMsg(message, data.message || "User registered.");
          userForm.reset();
          await loadSubjects();
          await loadUsers();
          nameInput.focus();
        } catch (_err) {
          setMsg(message, "Network error. Try again.", true);
        }
      });

      copyForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(copyMessage, "Copying...");
        const sourceIdSub = Number(copySourceSelect.value);
        const newSubName = copyNewSubjectInput.value.trim();
        try {
          const response = await fetch("/api/admin/copy-subject-users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ actorId: currentUser.idUser, sourceIdSub, newSubName }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(copyMessage, data.message || "Could not copy names.", true);
            return;
          }
          setMsg(copyMessage, data.message || "Copied.");
          copyForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(copyMessage, "Network error. Try again.", true);
        }
      });

      loadSubjects().catch((err) => setMsg(subjectMessage, err.message, true));
      loadUsers().catch((err) => setMsg(usersMessage, err.message, true));
    </script>
  </body>
</html>
