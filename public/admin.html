<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer assessment — Admin</title>
    <link rel="icon" href="/include/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <img class="logo-backdrop" src="/include/logo.png" alt="" aria-hidden="true" />

    <nav class="top-actions" aria-label="Quick actions">
      <a class="button button-sm" href="/" title="Home">🏠</a>
    </nav>

    <main class="page">
      <section class="content">
        <h1 class="title">Admin</h1>
        <p class="subtitle">Manage your subjects and register users into your own subjects.</p>

        <form id="add-subject-form" class="login-form admin-form">
          <label for="new-subject-name">Add subject</label>
          <div class="admin-inline">
            <input
              id="new-subject-name"
              name="subName"
              type="text"
              placeholder="Subject name"
              autocomplete="off"
              required
            />
            <button type="submit" class="button button-sm primary">Add subject</button>
          </div>
          <p id="subject-message" class="login-message" aria-live="polite"></p>
        </form>

        <section class="admin-form" aria-labelledby="edit-subject-heading">
          <h2 id="edit-subject-heading" class="admin-h2">Edit subject</h2>
          <label for="edit-subject-select">Choose subject</label>
          <div class="admin-inline">
            <select id="edit-subject-select"></select>
            <button type="button" class="button button-sm" id="edit-subject-load-btn">Open</button>
          </div>
          <p id="edit-subject-message" class="login-message" aria-live="polite"></p>

          <div id="edit-subject-panel" class="edit-subject-panel hidden">
            <form id="edit-subject-form" class="login-form">
              <label for="edit-subject-name">Subject name</label>
              <div class="admin-inline">
                <input
                  id="edit-subject-name"
                  name="subName"
                  type="text"
                  autocomplete="off"
                  required
                  maxlength="255"
                />
                <button type="submit" class="button button-sm primary">Save name</button>
              </div>
            </form>

            <h3 class="admin-h3">Enlisted students</h3>
            <div class="table-wrap">
              <table class="admin-table" aria-label="Students in subject">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Password changed</th>
                    <th>Last login</th>
                    <th class="admin-actions-col">Actions</th>
                  </tr>
                </thead>
                <tbody id="edit-subject-students-tbody"></tbody>
              </table>
            </div>
            <p id="edit-subject-students-message" class="login-message" aria-live="polite"></p>
          </div>
        </section>

        <form id="delete-subject-form" class="login-form admin-form">
          <label for="delete-subject-select">Delete subject</label>
          <div class="admin-inline">
            <select id="delete-subject-select" name="idSub" required></select>
            <button type="submit" class="button button-sm danger">Delete</button>
          </div>
          <p id="delete-subject-message" class="login-message" aria-live="polite"></p>
        </form>

        <form id="add-user-form" class="login-form admin-form">
          <label for="new-user-name">Add user</label>
          <div class="admin-inline">
            <input
              id="new-user-name"
              name="name"
              type="text"
              placeholder="User name"
              autocomplete="off"
              required
            />
            <select id="subject-select" name="idSub" required></select>
            <button type="submit" class="button button-sm primary">Register</button>
          </div>
          <p id="admin-message" class="login-message" aria-live="polite"></p>
        </form>

        <form id="copy-form" class="login-form admin-form">
          <label for="copy-source-subject">Copy names to a new subject</label>
          <div class="admin-inline">
            <select id="copy-source-subject" name="sourceIdSub" required></select>
            <input
              id="copy-new-subject-name"
              name="newSubName"
              type="text"
              placeholder="New subject name"
              autocomplete="off"
              required
            />
            <button type="submit" class="button button-sm primary">Copy names</button>
          </div>
          <p id="copy-message" class="login-message" aria-live="polite"></p>
        </form>

        <section class="admin-form">
          <h2 class="admin-h2">Users</h2>
          <div class="table-wrap">
            <table class="admin-table" aria-label="Users list">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Password changed</th>
                  <th class="admin-actions-col">Actions</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          <p id="users-message" class="login-message" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <div
      class="overlay hidden"
      id="orphan-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="orphan-title"
    >
      <div class="overlay-card">
        <h2 id="orphan-title">Delete subject</h2>
        <p id="orphan-body" class="subtitle" style="margin-top: 8px"></p>
        <ul id="orphan-list" class="orphan-list"></ul>
        <div class="overlay-actions">
          <button type="button" class="button button-sm danger" id="orphan-delete-users">
            Yes, delete these users
          </button>
          <button type="button" class="button button-sm primary" id="orphan-keep-users">
            No, keep users (subject only)
          </button>
          <button type="button" class="button button-sm" id="orphan-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      const userForm = document.getElementById("add-user-form");
      const subjectForm = document.getElementById("add-subject-form");
      const deleteSubjectForm = document.getElementById("delete-subject-form");
      const copyForm = document.getElementById("copy-form");
      const message = document.getElementById("admin-message");
      const subjectMessage = document.getElementById("subject-message");
      const deleteSubjectMessage = document.getElementById("delete-subject-message");
      const copyMessage = document.getElementById("copy-message");
      const nameInput = document.getElementById("new-user-name");
      const subjectSelect = document.getElementById("subject-select");
      const copySourceSelect = document.getElementById("copy-source-subject");
      const deleteSubjectSelect = document.getElementById("delete-subject-select");
      const editSubjectSelect = document.getElementById("edit-subject-select");
      const editSubjectLoadBtn = document.getElementById("edit-subject-load-btn");
      const editSubjectPanel = document.getElementById("edit-subject-panel");
      const editSubjectForm = document.getElementById("edit-subject-form");
      const editSubjectName = document.getElementById("edit-subject-name");
      const editSubjectMessage = document.getElementById("edit-subject-message");
      const editSubjectStudentsTbody = document.getElementById("edit-subject-students-tbody");
      const editSubjectStudentsMessage = document.getElementById("edit-subject-students-message");
      const newSubjectInput = document.getElementById("new-subject-name");
      const copyNewSubjectInput = document.getElementById("copy-new-subject-name");
      const usersTbody = document.getElementById("users-tbody");
      const usersMessage = document.getElementById("users-message");
      const orphanOverlay = document.getElementById("orphan-overlay");
      const orphanBody = document.getElementById("orphan-body");
      const orphanList = document.getElementById("orphan-list");
      const orphanDeleteUsersBtn = document.getElementById("orphan-delete-users");
      const orphanKeepUsersBtn = document.getElementById("orphan-keep-users");
      const orphanCancelBtn = document.getElementById("orphan-cancel");

      let pendingDeleteIdSub = null;
      let editingIdSub = null;

      function setMsg(el, text, isError = false) {
        el.textContent = text;
        el.classList.toggle("error", isError);
      }

      function toggleOrphanOverlay(show) {
        orphanOverlay.classList.toggle("hidden", !show);
        if (!show) pendingDeleteIdSub = null;
      }

      async function deleteSubjectRequest(idSub, deleteOrphans) {
        return fetch("/api/admin/delete-subject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idSub,
            deleteOrphans,
          }),
        });
      }

      async function loadSubjects() {
        const response = await fetch("/api/admin/subjects");
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not load subjects.");

        const subjects = data.subjects || [];
        const options = subjects.map(
          (s) => `<option value="${s.idSub}">${esc(s.subName)}</option>`
        );
        const empty = `<option value="">No subject yet</option>`;
        subjectSelect.innerHTML = options.length ? options.join("") : empty;
        copySourceSelect.innerHTML = options.length ? options.join("") : empty;
        deleteSubjectSelect.innerHTML = options.length ? options.join("") : empty;
        editSubjectSelect.innerHTML = options.length ? options.join("") : empty;

        if (editingIdSub && subjects.some((s) => Number(s.idSub) === Number(editingIdSub))) {
          editSubjectSelect.value = String(editingIdSub);
        } else if (editingIdSub) {
          editingIdSub = null;
          editSubjectPanel.classList.add("hidden");
        }
      }

      function esc(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function formatLastLogin(sec) {
        if (sec == null) return "never";
        const d = new Date(Number(sec) * 1000);
        return Number.isNaN(d.getTime()) ? "never" : d.toLocaleString();
      }

      async function loadEditSubject(idSub) {
        if (!Number.isFinite(idSub) || idSub <= 0) {
          setMsg(editSubjectMessage, "Select a subject.", true);
          return;
        }
        setMsg(editSubjectMessage, "Loading subject...");
        setMsg(editSubjectStudentsMessage, "");
        const response = await fetch(`/api/admin/subject/${encodeURIComponent(idSub)}`);
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not load subject.");

        editingIdSub = Number(data.subject.idSub);
        editSubjectName.value = data.subject.subName || "";
        editSubjectPanel.classList.remove("hidden");

        const students = data.students || [];
        editSubjectStudentsTbody.innerHTML = students.length
          ? students
              .map((s) => {
                const mark = s.passwordChanged ? "✓" : "✗";
                const cls = s.passwordChanged ? "ok" : "bad";
                return `<tr>
                  <td>${esc(s.name)}</td>
                  <td class="${cls}" aria-label="${s.passwordChanged ? "changed" : "default"}">${mark}</td>
                  <td>${esc(formatLastLogin(s.lastUsed))}</td>
                  <td class="admin-actions-col">
                    <button
                      type="button"
                      class="button button-sm danger admin-remove-student-btn"
                      data-id-user="${s.idUser}"
                      data-user-name="${esc(s.name)}"
                    >
                      Remove
                    </button>
                  </td>
                </tr>`;
              })
              .join("")
          : `<tr><td colspan="4">No students enlisted yet.</td></tr>`;

        setMsg(editSubjectMessage, `Editing “${data.subject.subName}”.`);
        setMsg(editSubjectStudentsMessage, `${students.length} student(s).`);
      }

      async function loadUsers() {
        setMsg(usersMessage, "Loading users...");
        const response = await fetch("/api/admin/users");
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not load users.");

        const users = data.users || [];
        usersTbody.innerHTML = users.length
          ? users
              .map((u) => {
                const mark = u.passwordChanged ? "✓" : "✗";
                const cls = u.passwordChanged ? "ok" : "bad";
                return `<tr>
                  <td>${esc(u.name)}</td>
                  <td class="${cls}" aria-label="${u.passwordChanged ? "changed" : "default"}">${mark}</td>
                  <td class="admin-actions-col">
                    <button type="button" class="button button-sm admin-reset-pw-btn" data-id-user="${u.idUser}" data-user-name="${esc(u.name)}">
                      Reset password
                    </button>
                  </td>
                </tr>`;
              })
              .join("")
          : `<tr><td colspan="3">No users yet.</td></tr>`;

        setMsg(usersMessage, `${users.length} user(s).`);
      }

      usersTbody.addEventListener("click", async (e) => {
        const btn = e.target.closest(".admin-reset-pw-btn");
        if (!btn) return;
        const idUser = Number(btn.getAttribute("data-id-user"));
        const userName = btn.getAttribute("data-user-name") || "";
        if (!Number.isFinite(idUser) || idUser <= 0) return;
        if (
          !confirm(
            `Reset password for "${userName}" to the default (Java5cript)? The student should sign in and change it afterward.`
          )
        ) {
          return;
        }
        btn.disabled = true;
        setMsg(usersMessage, "Resetting password…");
        try {
          const response = await fetch("/api/admin/reset-user-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idUser }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(usersMessage, data.message || "Could not reset password.", true);
            btn.disabled = false;
            return;
          }
          setMsg(usersMessage, data.message || "Password reset.");
          await loadUsers();
          if (editingIdSub) await loadEditSubject(editingIdSub);
        } catch (_err) {
          setMsg(usersMessage, "Network error. Try again.", true);
          btn.disabled = false;
        }
      });

      editSubjectLoadBtn.addEventListener("click", async () => {
        const idSub = Number(editSubjectSelect.value);
        try {
          await loadEditSubject(idSub);
        } catch (err) {
          setMsg(editSubjectMessage, String(err.message || err), true);
          editSubjectPanel.classList.add("hidden");
        }
      });

      editSubjectForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!editingIdSub) {
          setMsg(editSubjectMessage, "Open a subject first.", true);
          return;
        }
        const subName = editSubjectName.value.trim();
        setMsg(editSubjectMessage, "Saving...");
        try {
          const response = await fetch("/api/admin/update-subject", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idSub: editingIdSub, subName }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(editSubjectMessage, data.message || "Could not update subject.", true);
            return;
          }
          setMsg(editSubjectMessage, data.message || "Subject updated.");
          await loadSubjects();
          editSubjectSelect.value = String(editingIdSub);
        } catch (_err) {
          setMsg(editSubjectMessage, "Network error. Try again.", true);
        }
      });

      editSubjectStudentsTbody.addEventListener("click", async (e) => {
        const btn = e.target.closest(".admin-remove-student-btn");
        if (!btn || !editingIdSub) return;
        const idUser = Number(btn.getAttribute("data-id-user"));
        const userName = btn.getAttribute("data-user-name") || "";
        if (!Number.isFinite(idUser) || idUser <= 0) return;
        if (!confirm(`Remove "${userName}" from this subject?`)) return;

        btn.disabled = true;
        setMsg(editSubjectStudentsMessage, "Removing...");
        try {
          const first = await fetch("/api/admin/remove-user-from-subject", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idSub: editingIdSub, idUser }),
          });
          const firstData = await first.json();
          if (!first.ok || !firstData.ok) {
            setMsg(editSubjectStudentsMessage, firstData.message || "Could not remove student.", true);
            btn.disabled = false;
            return;
          }

          let result = firstData;
          if (firstData.needsOrphanDecision) {
            const deleteAccount = confirm(
              `"${userName}" has no other subjects. Delete this user account as well?`
            );
            const second = await fetch("/api/admin/remove-user-from-subject", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ idSub: editingIdSub, idUser, deleteIfOrphan: deleteAccount }),
            });
            result = await second.json();
            if (!second.ok || !result.ok) {
              setMsg(editSubjectStudentsMessage, result.message || "Could not remove student.", true);
              btn.disabled = false;
              return;
            }
          }

          setMsg(editSubjectStudentsMessage, result.message || "Student removed.");
          await loadEditSubject(editingIdSub);
          await loadUsers();
        } catch (_err) {
          setMsg(editSubjectStudentsMessage, "Network error. Try again.", true);
          btn.disabled = false;
        }
      });

      subjectForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(subjectMessage, "Adding subject...");

        const subName = newSubjectInput.value.trim();
        try {
          const response = await fetch("/api/admin/add-subject", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subName }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(subjectMessage, data.message || "Could not add subject.", true);
            return;
          }
          setMsg(subjectMessage, data.message || "Subject added.");
          subjectForm.reset();
          await loadSubjects();
          await loadUsers();
          newSubjectInput.focus();
        } catch (_err) {
          setMsg(subjectMessage, "Network error. Try again.", true);
        }
      });

      deleteSubjectForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const idSub = Number(deleteSubjectSelect.value);
        if (!Number.isFinite(idSub) || idSub <= 0) {
          setMsg(deleteSubjectMessage, "Select a subject.", true);
          return;
        }
        setMsg(deleteSubjectMessage, "Checking...");
        try {
          const response = await deleteSubjectRequest(idSub, undefined);
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(deleteSubjectMessage, data.message || "Could not delete subject.", true);
            return;
          }
          if (data.needsOrphanDecision) {
            pendingDeleteIdSub = idSub;
            orphanBody.textContent = `Deleting "${data.subName}" would leave these users with no subject links. Delete these users too?`;
            orphanList.innerHTML = (data.orphanUsers || [])
              .map((u) => `<li>${esc(u.name)}</li>`)
              .join("");
            toggleOrphanOverlay(true);
            setMsg(deleteSubjectMessage, "");
            return;
          }
          setMsg(deleteSubjectMessage, data.message || "Subject deleted.");
          deleteSubjectForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(deleteSubjectMessage, "Network error. Try again.", true);
        }
      });

      orphanCancelBtn.addEventListener("click", () => toggleOrphanOverlay(false));
      orphanOverlay.addEventListener("click", (e) => {
        if (e.target === orphanOverlay) toggleOrphanOverlay(false);
      });

      async function finishDelete(deleteOrphans) {
        if (!pendingDeleteIdSub) return;
        setMsg(deleteSubjectMessage, "Deleting...");
        try {
          const response = await deleteSubjectRequest(pendingDeleteIdSub, deleteOrphans);
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(deleteSubjectMessage, data.message || "Could not delete subject.", true);
            return;
          }
          toggleOrphanOverlay(false);
          setMsg(deleteSubjectMessage, data.message || "Subject deleted.");
          deleteSubjectForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(deleteSubjectMessage, "Network error. Try again.", true);
        }
      }

      orphanDeleteUsersBtn.addEventListener("click", () => finishDelete(true));
      orphanKeepUsersBtn.addEventListener("click", () => finishDelete(false));

      userForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(message, "Registering...");
        const name = nameInput.value.trim();
        const idSub = Number(subjectSelect.value);
        try {
          const response = await fetch("/api/admin/add-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, idSub }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(message, data.message || "Could not register user.", true);
            return;
          }
          setMsg(message, data.message || "User registered.");
          userForm.reset();
          await loadSubjects();
          await loadUsers();
          if (editingIdSub && Number(idSub) === Number(editingIdSub)) {
            await loadEditSubject(editingIdSub);
          }
          nameInput.focus();
        } catch (_err) {
          setMsg(message, "Network error. Try again.", true);
        }
      });

      copyForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg(copyMessage, "Copying...");
        const sourceIdSub = Number(copySourceSelect.value);
        const newSubName = copyNewSubjectInput.value.trim();
        try {
          const response = await fetch("/api/admin/copy-subject-users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sourceIdSub, newSubName }),
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            setMsg(copyMessage, data.message || "Could not copy names.", true);
            return;
          }
          setMsg(copyMessage, data.message || "Copied.");
          copyForm.reset();
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          setMsg(copyMessage, "Network error. Try again.", true);
        }
      });

      async function bootstrap() {
        try {
          const response = await fetch("/api/me");
          const data = await response.json();
          if (!response.ok || !data.ok || !data.user || !data.user.isAdmin) {
            window.location.href = "/";
            return;
          }
          await loadSubjects();
          await loadUsers();
        } catch (_err) {
          window.location.href = "/";
        }
      }

      void bootstrap();
    </script>
  </body>
</html>
